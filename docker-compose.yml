services:
  wechat-monitor:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wechat-monitor
    ports:
      - "8080:8000"
    volumes:
      - ./backend/wechat_monitor.db:/app/wechat_monitor.db
      - ./backend/wechat_auth_state.json:/app/wechat_auth_state.json
      - ./backend/downloads:/app/downloads
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai